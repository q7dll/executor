name: Build EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: g++ main.cpp -o executor.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: executor
          path: executor.exe
